name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-gate:
    name: Host gate (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  windows-build:
    name: Windows build + test (x86_64-pc-windows-msvc, crt-static)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: cargo check --target x86_64-pc-windows-msvc --all-targets
      - name: Test (Windows host)
        run: cargo test
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
