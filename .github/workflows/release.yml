# VeloEdit — release workflow (SPEC §6.1 asset matrix)
#
# This workflow runs ONLY when the owner pushes a v* tag or dispatches it
# manually. Ordinary pushes and pull requests never trigger it: code can
# merge to main without releasing. Never push a release tag without the
# project owner's explicit confirmation (PROJECT_RULES.md).
#
# It builds the three §6.1 assets from the tagged commit on a Windows
# runner — VeloEdit-v<version>-x64-Setup.exe (NSIS),
# VeloEdit-v<version>-x64-Setup.msi (WiX v4), and
# VeloEdit-v<version>-x64-Portable.zip — plus SHA256SUMS.txt, and attaches
# all four to the GitHub Release for the tag. The full test gate runs
# BEFORE any packaging; a failing test fails the release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the release from"
        required: true
        default: "v1.1.3"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: windows-latest
    steps:
      - name: Resolve the release tag
        id: tag
        shell: pwsh
        env:
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { $env:RELEASE_INPUT_TAG }
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z') { throw "Tag must look like v1.0.0, got: $tag" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Verify existing tag and source versions
        id: source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid checkout SHA' }
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          $refs = @(git ls-remote origin $tagRef "$tagRef^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify remote tag' }
          $direct = $null
          $peeled = $null
          foreach ($line in $refs) {
            if ($line -cmatch "^([0-9a-f]{40})\s+$([regex]::Escape($tagRef))$") { $direct = $Matches[1] }
            elseif ($line -cmatch "^([0-9a-f]{40})\s+$([regex]::Escape($tagRef))\^\{\}$") { $peeled = $Matches[1] }
            else { throw 'Malformed remote tag response' }
          }
          if (-not $direct) { throw 'Release requires an existing remote tag' }
          $commit = if ($peeled) { $peeled } else { $direct }
          if ($commit -cne $head) { throw 'Remote tag does not match checkout HEAD' }
          $cargo = Get-Content Cargo.toml -Raw
          $lock = Get-Content Cargo.lock -Raw
          $nsis = Get-Content installer/VeloEdit.nsi -Raw
          $wix = Get-Content installer/Package.wxs -Raw
          $version = [regex]::Escape($env:RELEASE_VERSION)
          if ($cargo -cnotmatch "(?m)^version = `"$version`"\r?$") { throw 'Cargo version mismatch' }
          if ($lock -cnotmatch "(?s)name = `"veloedit`"\r?\nversion = `"$version`"") { throw 'Cargo lock version mismatch' }
          if ($nsis -cnotmatch "(?m)^!define VERSION `"$version`"\r?$") { throw 'NSIS version mismatch' }
          if ($wix -cnotmatch "Version=`"$version`"") { throw 'WiX version mismatch' }
          "sha=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ---- Gate first: nothing is packaged unless the whole gate passes.
      - name: Release contract checks (offline mocks)
        shell: pwsh
        run: |
          ./tests/Test-ReleasePreparation.ps1
          ./tests/Test-MsiContract.ps1
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test gate (host target)
        run: cargo test

      # ---- Build the release binary (static CRT via .cargo/config.toml).
      - name: Build release (x86_64-pc-windows-msvc, crt-static)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage the assets folder
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "target\x86_64-pc-windows-msvc\release\VeloEdit.exe"

          # Portable layout: exe + LICENSE + an empty data/ entry whose
          # README explains what the folder is for (portable mode).
          New-Item -ItemType Directory -Force stage-portable\data | Out-Null
          Copy-Item $exe stage-portable\VeloEdit.exe
          Copy-Item LICENSE stage-portable\LICENSE
          @(
            "VeloEdit portable data folder"
            ""
            "Everything VeloEdit remembers lives in this folder, next to the"
            "program: settings.json (theme, accent, font size, window"
            "position, recent files) and, while you edit a document up to"
            "16 MB, the crash-recovery snapshot (recovery.bin /"
            "recovery.json). Nothing is written to %APPDATA%, and the"
            "only registry entry is the Explorer menu item, added only"
            "if you ask for it (--install-shell) — so the whole program"
            "folder stays portable."
            ""
            "Deleting this folder resets VeloEdit to its first-run state."
          ) | Set-Content stage-portable\data\README-data.txt
          Compress-Archive -Path stage-portable\* -DestinationPath "dist\VeloEdit-v$version-x64-Portable.zip"

      - name: Build the NSIS Setup exe
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed: $LASTEXITCODE" }
          }
          # The choco install lands in "Program Files (x86)\NSIS", which is
          # not on this process's PATH - resolve the exe explicitly.
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            foreach ($candidate in @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe"
            )) {
              if (Test-Path $candidate) { $makensis = $candidate; break }
            }
          }
          if (-not $makensis) { throw "makensis.exe not found after install" }
          & $makensis "-DEXE_PATH=$PWD\target\x86_64-pc-windows-msvc\release\VeloEdit.exe" "-DOUT_DIR=$PWD\dist" installer\VeloEdit.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist\VeloEdit-v$version-x64-Setup.exe")) { throw "Setup exe was not produced" }

      - name: Build the WiX MSI
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          dotnet tool install --global wix --version "4.0.6"
          if ($LASTEXITCODE -ne 0) { throw "WiX installation failed: $LASTEXITCODE" }
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          # The extension version must match the tool's major version:
          # an unpinned "wix extension add" fetches the latest extension
          # (v7), which a WiX v4 tool cannot load (WIX0144).
          wix extension add WixToolset.UI.wixext/4.0.6
          if ($LASTEXITCODE -ne 0) { throw "wix extension add failed with exit code $LASTEXITCODE" }
          wix build installer\Package.wxs -arch x64 -ext WixToolset.UI.wixext -o "dist\VeloEdit-v$version-x64-Setup.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed with exit code $LASTEXITCODE" }

      - name: Validate the MSI metadata and payload
        shell: pwsh
        run: |
          ./scripts/Test-MsiArtifact.ps1 -MsiPath 'dist/VeloEdit-v${{ steps.tag.outputs.version }}-x64-Setup.msi' -ExecutablePath target/x86_64-pc-windows-msvc/release/VeloEdit.exe -LicensePath LICENSE -ExpectedVersion '${{ steps.tag.outputs.version }}' -OutputDirectory dist/msi-audit

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        working-directory: dist
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          $assets = @(
            "VeloEdit-v$version-x64-Setup.exe",
            "VeloEdit-v$version-x64-Setup.msi",
            "VeloEdit-v$version-x64-Portable.zip"
          )
          $lines = foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing asset: $asset" }
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
            "$hash  $asset"
          }
          $lines | Set-Content SHA256SUMS.txt
          Get-ChildItem | Format-Table Name, Length

      # ---- Release notes: the CHANGELOG's section for this version, when
      # it can be extracted; otherwise a short fixed factual body.
      - name: Extract release notes
        id: notes
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\] — Unreleased\s*\r?\n(.*?)(?=^## \[|\z)"
          $body = if ($changelog -match $pattern) {
            $Matches[1].Trim()
          } else {
            "VeloEdit $version. See CHANGELOG.md for details."
          }
          $body | Set-Content release-notes.md

      - name: Create the GitHub Release with the four assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          $assets = @(
            "dist\VeloEdit-v$version-x64-Setup.exe",
            "dist\VeloEdit-v$version-x64-Setup.msi",
            "dist\VeloEdit-v$version-x64-Portable.zip",
            "dist\SHA256SUMS.txt"
          )
          gh release create '${{ steps.tag.outputs.tag }}' $assets --verify-tag --target '${{ steps.source.outputs.sha }}' `
            --title "VeloEdit v$version" `
            --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed: $LASTEXITCODE" }
